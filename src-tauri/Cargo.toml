[package]
name = "sifs"
version = "0.2.0"
description = "Search your files by name, content and meaning"
edition = "2021"
rust-version = "1.90"
default-run = "sifs"

[lib]
name = "sifs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
walkdir = "2"
notify = "6"
globset = "0.4"
anyhow = "1"
log = "0.4"
encoding_rs = "0.8"
chardetng = "0.1"
html-escape = "0.2"
libc = "0.2"
# Office files: zips of XML. Only stored and deflated parts (all Office
# writes); 9.0 fixes every RustSec advisory against zip (all in extraction,
# which SIFS never does). quick-xml 0.41 fixed its two.
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs flate2 to have a backend: the pure-Rust miniz_oxide.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
quick-xml = "=0.42.0"
# Words split as the contents index splits them, by Unicode category
# (already built for Tauri).
regex = "1.10"

[features]
default = ["app"]
# The desktop app. The index builds and tests without it: cargo test --no-default-features
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]

[dev-dependencies]
tempfile = "3"
