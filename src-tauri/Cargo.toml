[package]
name = "sifs"
version = "0.2.0"
description = "Search your files by name, content and meaning"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sifs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
notify = "6"
globset = "0.4"
anyhow = "1"
log = "0.4"

[features]
default = ["app"]
# The desktop app. The index builds and tests without it: cargo test --no-default-features
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]

[dev-dependencies]
tempfile = "3"
